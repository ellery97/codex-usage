<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex Token 用量</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar" aria-label="Codex token 用量控制区">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img">
            <path d="M4 7.2 12 3l8 4.2v9.6L12 21l-8-4.2V7.2Z" />
            <path d="M8 8.8h8M8 12h8M8 15.2h5.2" />
          </svg>
        </span>
        <div>
          <h1>Codex Token 用量</h1>
          <p id="sourceLabel">本地会话</p>
        </div>
      </div>
      <div class="status-strip">
        <span id="rangeLabel">范围：全部</span>
        <span id="updatedLabel">更新时间：--</span>
      </div>
    </header>

    <main class="shell">
      <section class="control-grid" aria-label="仪表盘筛选条件">
        <label>
          <span>范围</span>
          <select id="rangeSelect">
            <option value="all">全部时间</option>
            <option value="today">今天</option>
            <option value="24h">最近 24 小时</option>
            <option value="7d" selected>最近 7 天</option>
            <option value="30d">最近 30 天</option>
            <option value="12w">最近 12 周</option>
            <option value="custom">自定义</option>
          </select>
        </label>
        <label>
          <span>分组</span>
          <select id="groupSelect">
            <option value="day" selected>按天</option>
            <option value="month">按月</option>
            <option value="model">按模型</option>
            <option value="cwd">按工作目录</option>
            <option value="session">按会话</option>
          </select>
        </label>
        <label>
          <span>排序</span>
          <select id="sortSelect">
            <option value="key">名称 / 时间</option>
            <option value="total">Token 总量</option>
            <option value="input">输入</option>
            <option value="cached">缓存输入</option>
            <option value="output">输出</option>
            <option value="reasoning">推理输出</option>
            <option value="requests">请求数</option>
            <option value="sessions">会话数</option>
            <option value="cost">预估金额</option>
          </select>
        </label>
        <label>
          <span>方向</span>
          <select id="directionSelect">
            <option value="auto" selected>自动</option>
            <option value="asc">升序</option>
            <option value="desc">降序</option>
          </select>
        </label>
        <label>
          <span>行数</span>
          <input id="limitInput" type="number" min="0" max="500" value="60" />
        </label>
        <label>
          <span>去重</span>
          <select id="dedupeSelect">
            <option value="global" selected>全局</option>
            <option value="file">按文件</option>
          </select>
        </label>
        <label class="custom-range">
          <span>开始</span>
          <input id="fromInput" type="date" />
        </label>
        <label class="custom-range">
          <span>结束</span>
          <input id="toInput" type="date" />
        </label>
        <button id="refreshButton" type="button" class="primary-action">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12a9 9 0 0 1-15.4 6.36M3 12A9 9 0 0 1 18.4 5.64" />
            <path d="M21 5v7h-7M3 19v-7h7" />
          </svg>
          <span>刷新</span>
        </button>
      </section>

      <section class="metric-grid" aria-label="Token 汇总">
        <article class="metric-card accent-blue">
          <span>Token 总量</span>
          <strong id="totalTokens">--</strong>
          <small id="totalSub">-- 次请求</small>
        </article>
        <article class="metric-card accent-cyan">
          <span>输入 Token</span>
          <strong id="inputTokens">--</strong>
          <small id="cachedInput">-- 缓存</small>
        </article>
        <article class="metric-card accent-amber">
          <span>输出 Token</span>
          <strong id="outputTokens">--</strong>
          <small id="reasoningOutput">-- 推理输出</small>
        </article>
        <article class="metric-card accent-green">
          <span>缓存命中率</span>
          <strong id="cacheRatio">--</strong>
          <small id="uncachedInput">-- 未缓存输入</small>
        </article>
        <article class="metric-card accent-rose">
          <span>预估金额</span>
          <strong id="estimatedCost">--</strong>
          <small id="costSub">按官方价估算</small>
        </article>
      </section>

      <section class="analytics-grid">
        <article class="panel wide">
          <div class="panel-heading">
            <div>
              <h2 id="mainChartTitle">Token 用量趋势</h2>
              <p id="mainChartMeta">--</p>
            </div>
            <div class="legend" aria-label="图例">
              <span><i class="legend-total"></i>总量</span>
              <span><i class="legend-input"></i>输入</span>
              <span><i class="legend-output"></i>输出</span>
            </div>
          </div>
          <div class="chart-stage">
            <canvas id="usageChart" height="340" data-chart-height="340" aria-label="Token 用量趋势图"></canvas>
            <div id="chartTooltip" class="chart-tooltip" hidden></div>
          </div>
        </article>

        <article class="panel">
          <div class="panel-heading">
            <div>
              <h2>Token 构成</h2>
              <p>输入 / 输出 / 缓存</p>
            </div>
          </div>
          <canvas id="mixChart" width="260" height="260" data-chart-height="260" aria-label="Token 构成图"></canvas>
          <div class="mix-list">
            <span><i class="swatch input"></i>输入</span>
            <span><i class="swatch cached"></i>缓存</span>
            <span><i class="swatch output"></i>输出</span>
            <span><i class="swatch reasoning"></i>推理</span>
          </div>
        </article>
      </section>

      <section class="lower-grid">
        <article class="panel">
          <div class="panel-heading">
            <div>
              <h2>扫描状态</h2>
              <p id="scanMeta">--</p>
            </div>
          </div>
          <div class="scan-grid">
            <span>会话数<strong id="sessionCount">--</strong></span>
            <span>请求数<strong id="requestCount">--</strong></span>
            <span>文件数<strong id="fileCount">--</strong></span>
            <span>全局去重<strong id="globalDedupe">--</strong></span>
          </div>
        </article>

        <article class="panel table-panel">
          <div class="panel-heading table-tools">
            <div>
              <h2>明细表</h2>
              <p id="tableMeta">--</p>
            </div>
            <label class="search-box">
              <span class="sr-only">搜索分组</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m21 21-4.35-4.35M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" />
              </svg>
              <input id="tableSearch" type="search" placeholder="搜索分组" />
            </label>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>分组</th>
                  <th>会话</th>
                  <th>请求</th>
                  <th>总量</th>
                  <th>输入</th>
                  <th>缓存</th>
                  <th>输出</th>
                  <th>推理</th>
                  <th>金额</th>
                  <th>缓存率</th>
                </tr>
              </thead>
              <tbody id="usageTable"></tbody>
            </table>
          </div>
        </article>
      </section>
    </main>

    <div id="loadingOverlay" class="loading-overlay" hidden>
      <div class="loader" role="status" aria-live="polite">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3a9 9 0 1 0 9 9" />
        </svg>
        <span>正在扫描本地 Codex 会话</span>
      </div>
    </div>

    <div id="errorToast" class="error-toast" role="alert" hidden></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
